<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Büşra ❤️ Muhammet</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Comic Sans MS', 'Chalkboard SE', sans-serif;
        }

        body {
            background-color: #fff5f5;
            color: #4a4a4a;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* GERÇEK UÇUŞAN KALPLER SİSTEMİ */
        #heart-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 1;
        }

        .heart {
            position: absolute;
            color: #ff6b81;
            opacity: 0.6;
            animation: floatUp 7s linear infinite;
            bottom: -50px;
        }

        @keyframes floatUp {
            0% { transform: translateY(0) rotate(0deg); opacity: 0; }
            10% { opacity: 0.7; }
            90% { opacity: 0.7; }
            100% { transform: translateY(-110vh) rotate(360deg); opacity: 0; }
        }

        .main-card {
            max-width: 800px;
            width: 100%;
            background: #ffffff;
            border: 3px solid #ffb3b3;
            border-radius: 30px;
            padding: 35px;
            box-shadow: 0 15px 35px rgba(255, 107, 129, 0.1);
            margin-top: 20px;
            position: relative;
            z-index: 2;
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-size: 2.4rem;
            color: #ff4757;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.05);
        }

        .header p {
            font-size: 1.1rem;
            margin-top: 12px;
            color: #666;
            font-style: italic;
        }

        /* Fotoğraf Alanı */
        .photo-area {
            text-align: center;
            margin-bottom: 35px;
        }

        .polaroid {
            background: #fff;
            padding: 15px 15px 55px 15px;
            border: 2px solid #ffccd5;
            display: inline-block;
            transform: rotate(-1.5deg);
            box-shadow: 0 10px 25px rgba(0,0,0,0.05);
            border-radius: 4px;
        }

        .polaroid img {
            width: 350px;
            max-width: 100%;
            display: block;
            border-radius: 4px;
        }

        .polaroid-text {
            margin-top: 15px;
            font-weight: bold;
            font-size: 1.1rem;
            color: #ff4757;
        }

        /* Zaman Sayacı */
        .timer-box {
            background: #74b9ff;
            color: white;
            padding: 18px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 25px;
            box-shadow: 0 8px 20px rgba(116, 185, 255, 0.2);
        }

        /* Konya - Mersin Mesafe Sayacı */
        .distance-box {
            background: #ff9f43;
            color: white;
            padding: 18px;
            border-radius: 20px;
            text-align: center;
            margin-bottom: 35px;
            box-shadow: 0 8px 20px rgba(255, 159, 67, 0.2);
        }

        /* Cem Adrian Şarkı Kutusu */
        .music-reminder {
            display: flex;
            align-items: center;
            gap: 20px;
            background: #fff5f6;
            padding: 15px;
            border: 2px solid #ffccd5;
            border-radius: 20px;
            margin-bottom: 35px;
        }

        .cover-art {
            width: 75px;
            height: 75px;
            background: #ff4757;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-size: 2rem;
        }

        .song-details h4 {
            font-size: 1.1rem;
            color: #2f3542;
        }

        .song-details p {
            font-size: 0.9rem;
            color: #ff4757;
            font-weight: bold;
        }

        /* İTİRAFLARIM Bölümü */
        .confession-section {
            margin-bottom: 35px;
        }

        .confession-card {
            background: #ffffff;
            border: 2px solid #ffccd5;
            padding: 20px;
            border-radius: 20px;
            margin-bottom: 20px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
        }

        .confession-card h4 {
            font-size: 1.1rem;
            color: #d63031;
            margin-bottom: 12px;
            display: flex;
            align-items: flex-start;
            gap: 10px;
        }

        .reveal-btn {
            background: #ff6b81;
            color: white;
            border: none;
            padding: 8px 18px;
            border-radius: 25px;
            font-size: 0.9rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease;
            display: inline-flex;
            align-items: center;
            gap: 8px;
        }

        .reveal-btn:hover {
            background: #ff4757;
            transform: translateY(-1px);
        }

        .answer-panel {
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s ease-out;
            margin-top: 0;
        }

        .answer-panel.open {
            max-height: 200px;
            margin-top: 15px;
        }

        .answer-panel p {
            font-size: 1rem;
            color: #2f3542;
            font-weight: bold;
            background: #fff5f6;
            padding: 12px 15px;
            border-radius: 12px;
            border-left: 4px solid #ff4757;
        }

        /* Mesafe Yok Etme Simülatörü */
        .simulator-section {
            background: #fff5f6;
            border: 2px solid #ffccd5;
            padding: 25px;
            border-radius: 20px;
            margin-bottom: 35px;
            text-align: center;
        }

        .sim-buttons {
            display: flex;
            gap: 12px;
            justify-content: center;
            margin-top: 18px;
            flex-wrap: wrap;
        }

        .sim-btn {
            background: #ffffff;
            color: #ff4757;
            padding: 10px 18px;
            border: 2px solid #ff6b81;
            border-radius: 25px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s;
        }

        .sim-btn:hover { background: #ff6b81; color: white; }

        /* Spotify Bölümü */
        .spotify-section {
            background: #1DB954;
            color: white;
            padding: 20px;
            border-radius: 20px;
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
            box-shadow: 0 8px 20px rgba(29, 185, 84, 0.2);
        }

        .spotify-btn {
            background: white;
            color: #1DB954;
            padding: 8px 18px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: bold;
            display: inline-block;
        }

        /* Film Kategorileri */
        .movie-cat {
            border: 2px solid #ffccd5;
            border-radius: 20px;
            margin-bottom: 15px;
            overflow: hidden;
            cursor: pointer;
            background: white;
        }

        .movie-cat-header {
            background: #ff6b81;
            color: white;
            padding: 15px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
        }

        .movie-cat-content {
            background: white;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.3s ease-out;
        }

        .movie-cat.open .movie-cat-content { max-height: 1000px; }
        .movie-item { padding: 15px; border-bottom: 1px dashed #ffb3b3; }
        .movie-item:last-child { border-bottom: none; }
        .movie-item h4 { color: #ff4757; font-size: 1.05rem; margin-bottom: 5px; font-weight: bold; }
        .movie-item p { font-size: 0.9rem; color: #555; line-height: 1.4; }

        /* Affetme Butonu */
        .action-btn {
            width: 100%;
            background: #2ed573;
            color: white;
            padding: 16px;
            border: none;
            border-radius: 25px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 8px 25px rgba(46, 204, 113, 0.3);
            transition: all 0.2s;
        }

        .action-btn:hover { background: #26af5f; transform: translateY(-1px); }

    </style>
</
